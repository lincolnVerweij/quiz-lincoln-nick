<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/style.css">
    <title>Homepage</title>
</head>
<body>
    <div class="intro">
        <h1 class="title"> 
            <span class="welkomTxt">Welkom</span> op onze homepage!
        </h1>
        <p>Test je kennis met onze zelf gemaakte quizzes!</p>
    </div>

    <h2 class="quiz-title">Onze quizzes:</h2>

    <div class="quiz-cards-container">
        <div class="quiz-card">
            <h3 class="card-title">Quiz Nintendo</h3>
            <p id="lincolnHighScore" class="card-highscore">Highscore: 0</p>
            <button class="quiz-L">Start Quiz</button>
            <p class="quiz-author">gemaakt door: Lincoln Verweij</p>
        </div>
        
        <div class="quiz-card">
            <h3 class="card-title">Quiz Pokemon</h3>
            <p id="nickHighScore" class="card-highscore">Highscore: 0</p>
            <button class="quiz-N">Start Quiz</button>
            <p class="quiz-author">gemaakt door: Nick Ubert</p>
        </div> 
        
        <div class="quiz-card">
            <h3 class="card-title">Quiz Zelda Breath of The Wild</h3>
            <p id="tijnHighScore" class="card-highscore">Highscore: 0</p>
            <button class="quiz-T">Start Quiz</button>
            <p class="quiz-author">gemaakt door: Tijn Nederlof</p>
        </div> 
    </div>

    <div class="github-container">
        <button class="github">Onze Github!</button>
    </div>

    <script src="/script.js"></script>
</body>
</html>
