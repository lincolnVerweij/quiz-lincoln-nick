<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Quiz 2</title>
</head>
<body>
<div class="coreHome">
    <div class="gridHome">
        <img id="titleImg" src="Images/PokemonQuizTitle.png"> 
    
        <div class="quiz-container">
        
            <a class="back" href="/index.html">Back to home</a>

            <p id="welcomeMsg">Welkom bij de Pokemon quiz!</p> <br>

            <br>
            <p id="totalScoreDisplay">totale score: 0</p>
        </div>

        <div class="seperate"></div>

            <button class="cat-button3">Pokemon signature abilites</button>
            <button class="cat-button4">Pokemon signature moves</button>
        </div>
    </div>
</div>

        <br>

        </div>

        <br><br>

    </div>
</div>
